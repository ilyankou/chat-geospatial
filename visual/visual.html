<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #fff; }
    #vis { display: block; }
    #export-btn {
      position: fixed; top: 10px; right: 10px;
      padding: 6px 12px; font-size: 12px; cursor: pointer;
      background: #fff; border: 1px solid #ccc; border-radius: 4px;
    }
    #export-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <button id="export-btn">Export SVG</button>
  <div id="vis"></div>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script>
    var spec = {
      "$schema": "https://vega.github.io/schema/vega/v5.json",
      "width": 750,
      "height": 1000,
      "padding": {"left": 0, "right": 0, "top": 0, "bottom": 0},

      "signals": [
        {"name": "treeWidth", "value": 560},
        {"name": "x1", "value": 5},
        {"name": "x2", "value": 160},
        {"name": "x3", "value": 390}
      ],

      "data": [
        {
          "name": "tree",
          "url": "data.json",
          "transform": [
            {
              "type": "stratify",
              "key": "id",
              "parentKey": "parent",
            },
            {
              "type": "tree",
              "method": "tidy",
              "size": [{"signal": "height"}, {"signal": "treeWidth"}],
              "as": ["y", "x", "depth", "children"],
              "separation": true,
            },
            {"type": "formula", "expr": "datum.depth === 1 ? x1 : datum.depth === 2 ? x2 : datum.depth === 3 ? x3 : 0", "as": "x"},
            {"type": "joinaggregate", "groupby": ["parent"], "fields": ["y"], "ops": ["min"], "as": ["minYInGroup"]},
            {"type": "formula", "expr": "datum.depth === 2 ? (datum.size / 30879 * 100 < 1 ? '' : slice(format(datum.size / 30879 * 100, '.1f'), 0, -2)) : ''", "as": "pctInt"},
            {"type": "formula", "expr": "datum.depth === 2 ? '.' + slice(format(datum.size / 30879 * 100, '.1f'), -1) + (datum.y === datum.minYInGroup ? '%' : '') : ''", "as": "pctDec"}
          ]
        },
        {
          "name": "links_l3",
          "source": "tree",
          "transform": [
            { "type": "treelinks" },
            { "type": "filter", "expr": "datum.target.depth === 3" },
            { "type": "formula", "expr": "datum.source.x", "as": "_sx" },
            { "type": "formula", "expr": "datum.source.y", "as": "_sy" },
            { "type": "formula", "expr": "datum.target.x + 52", "as": "_tx" },
            { "type": "formula", "expr": "datum.target.y", "as": "_ty" },
            {
              "type": "linkpath",
              "orient": "horizontal",
              "shape": "diagonal",
              "sourceX": "_sx",
              "sourceY": "_sy",
              "targetX": "_tx",
              "targetY": "_ty"
            }
          ]
        },
        {
          "name": "links",
          "source": "tree",
          "transform": [
            { "type": "treelinks" },
            { "type": "filter", "expr": "datum.source.depth > 0 && datum.target.depth < 3" },
            { "type": "formula", "expr": "datum.source.x", "as": "_sx" },
            { "type": "formula", "expr": "datum.source.y", "as": "_sy" },
            { "type": "formula", "expr": "datum.target.x", "as": "_tx" },
            { "type": "formula", "expr": "datum.target.y", "as": "_ty" },
            {
              "type": "linkpath",
              "orient": "horizontal",
              "shape": "diagonal",
              "sourceX": "_sx",
              "sourceY": "_sy",
              "targetX": "_tx",
              "targetY": "_ty"
            }
          ]
        }
      ],

      "marks": [
        {
          "type": "path",
          "from": {"data": "links_l3"},
          "encode": {
            "update": {
              "path": {"field": "path"},
              "stroke": {"value": "#ccc"},
              "strokeWidth": {"value": 0.5},
              "strokeOpacity": {"value": 1.0},
              "strokeDash": {"value": [2, 4]}
            }
          }
        },
        {
          "type": "path",
          "from": {"data": "links"},
          "encode": {
            "update": {
              "path": {"field": "path"},
              "stroke": {"value": "#e8e8e8"},
              "strokeWidth": {"value": 0.75}
            }
          }
        },
        {
          "type": "symbol",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "strokeWidth": {"value": 0.75}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "size": {"signal": "datum.depth === 0 ? 0 : datum.depth === 1 ? pow(datum.size, 0.75) * 30 : pow(datum.size, 0.75) * 3"},
              "fill": {"signal": "datum.colour || '#999'"},
              "fillOpacity": {"value": 0},
              "stroke": {"signal": "datum.depth === 1 || datum.depth === 2 ? (datum.colour || '#999') : '#fff'"},
              "strokeWidth": {"signal": "datum.depth === 1 ? 1.5 : datum.depth === 2 & datum.colour !== '#999' ? 0.75 : 0.75"},
              "strokeOpacity": {"signal": "datum.depth === 1 || datum.depth === 2 ? 0.75 : 0"}
            }
          }
        },
        {
          "type": "text",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "fontSize": {"value": 9},
              "fontWeight": {"value": "bold"},
              "baseline": {"value": "middle"},
              "fill": {"value": "#333"}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "text": {"field": "pctInt"},
              "dx": {"value": 28},
              "align": {"value": "right"},
              "opacity": {"signal": "datum.depth === 2 ? 1 : 0"}
            }
          }
        },
        {
          "type": "text",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "fontSize": {"value": 9},
              "fontWeight": {"value": "bold"},
              "baseline": {"value": "middle"},
              "fill": {"value": "#333"}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "text": {"field": "pctDec"},
              "dx": {"value": 28},
              "align": {"value": "left"},
              "opacity": {"signal": "datum.depth === 2 ? 1 : 0"}
            }
          }
        },
        {
          "type": "text",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "fontSize": {"value": 9},
              "baseline": {"value": "middle"},
              "fill": {"value": "white"},
              "stroke": {"value": "white"},
              "strokeWidth": {"value": 4}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "text": {"signal": "datum.depth === 1 ? datum.name : ''"},
              "dx": {"value": 0},
              "dy": {"value": -3},
              "align": {"value": "center"},
              "fontWeight": {"value": "bold"}
            }
          }
        },
        {
          "type": "text",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "fontSize": {"signal": "datum.depth === 1 ? 11 : 9"},
              "baseline": {"value": "middle"},
              "fill": {"value": "#333"}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "text": {"field": "name"},
              "dx": {"signal": "datum.depth === 1 ? 0 : 52"},
              "dy": {"signal": "datum.depth === 1 ? -3 : 0"},
              "align": {"signal": "datum.depth === 1 ? 'center' : 'left'"},
              "fontStyle": {"signal": "datum.depth === 3 ? 'italic' : 'normal'"},
              "fontWeight": {"signal": "datum.depth === 1 ? 'bold' : 'normal'"},
              "opacity": {"signal": "datum.depth === 0 ? 0 : 1"}
            }
          }
        },
        {
          "type": "text",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "fontSize": {"value": 7},
              "fontWeight": {"value": "bold"},
              "fontStyle": {"value": "italic"},
              "baseline": {"value": "middle"},
              "fill": {"value": "white"},
              "stroke": {"value": "white"},
              "strokeWidth": {"value": 4}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "dy": {"value": 7},
              "text": {"signal": "datum.depth === 1 ? format(datum.size / 30879 * 100, '.1f') + '%' : ''"},
              "align": {"value": "center"}
            }
          }
        },
        {
          "type": "text",
          "from": {"data": "tree"},
          "encode": {
            "enter": {
              "fontSize": {"value": 9},
              "fontWeight": {"value": "bold"},
              "fontStyle": {"value": "italic"},
              "baseline": {"value": "middle"},
              "fill": {"value": "#333"}
            },
            "update": {
              "x": {"field": "x"},
              "y": {"field": "y"},
              "dy": {"value": 7},
              "text": {"signal": "datum.depth === 1 ? format(datum.size / 30879 * 100, '.1f') + '%' : ''"},
              "align": {"value": "center"},
              "opacity": {"signal": "datum.depth === 1 ? 1 : 0"}
            }
          }
        }
      ]
    };

    var view = new vega.View(vega.parse(spec), {
      renderer: "svg",
      container: "#vis",
      hover: true
    });
    view.run();

    document.getElementById('export-btn').addEventListener('click', function() {
      view.toSVG().then(function(svg) {
        var a = document.createElement('a');
        a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        a.download = 'visual.svg';
        a.click();
      });
    });
  </script>
</body>
</html>
